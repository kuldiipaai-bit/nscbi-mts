name: Supabase keep-alive

# Free Supabase projects pause after a week without activity. This pings the
# database twice a week. (Not needed once you self-host or move to a paid plan.)
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call ping()
        run: |
          URL=$(grep '^NEXT_PUBLIC_SUPABASE_URL=' web/.env.production | cut -d= -f2-)
          KEY=$(grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' web/.env.production | cut -d= -f2-)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'

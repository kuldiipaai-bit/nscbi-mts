name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - name: Schema, seed and RLS tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stubs.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_init.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/0002_harden_function_grants.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/0003_inactive_self_signup.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_test.sql

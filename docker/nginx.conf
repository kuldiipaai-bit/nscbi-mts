server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static export with trailingSlash: /day/ -> /day/index.html
  location / {
    try_files $uri $uri/ $uri/index.html /404.html;
  }

  # Never cache the service worker or HTML shell
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
  location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
